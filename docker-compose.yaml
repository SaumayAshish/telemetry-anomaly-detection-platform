services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: telemetry-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for clients on the host; INTERNAL is for containers on the compose network.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  timescaledb:
    image: timescale/timescaledb:2.29.2-pg16
    container_name: telemetry-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_app -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - timescale-data:/var/lib/postgresql/data

  # One-shot schema migration: the only thing that changes the schema. Run it before the services.
  migrate:
    build:
      context: ./db-migrations
    profiles: ["pipeline"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://timescaledb:5432/telemetry
      FLYWAY_USER: telemetry_app
      FLYWAY_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    command: migrate

  # Dev-only: the sensors the simulated producer emits. Not part of the schema migrations.
  seed-sensors:
    image: timescale/timescaledb:2.29.2-pg16
    profiles: ["pipeline"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${DB_PASSWORD:-localdevpassword}
    entrypoint: ["psql", "-h", "timescaledb", "-U", "telemetry_app", "-d", "telemetry", "-v", "ON_ERROR_STOP=1", "-c"]
    command:
      - >-
        INSERT INTO sensors (sensor_id, location, install_date, model) VALUES
        ('S-1001', 'dev-rack-1', DATE '2026-01-01', 'sim-temp'),
        ('S-1002', 'dev-rack-1', DATE '2026-01-01', 'sim-temp'),
        ('S-1003', 'dev-rack-2', DATE '2026-01-01', 'sim-temp'),
        ('S-1004', 'dev-rack-2', DATE '2026-01-01', 'sim-temp'),
        ('S-1005', 'dev-rack-3', DATE '2026-01-01', 'sim-temp')
        ON CONFLICT (sensor_id) DO NOTHING

  ingestion:
    build:
      context: .
      args:
        MODULE: ingestion-service
    image: telemetry/ingestion-service:dev
    profiles: ["pipeline"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  stream-processing:
    build:
      context: .
      args:
        MODULE: stream-processing-service
    image: telemetry/stream-processing-service:dev
    profiles: ["pipeline"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  alerting:
    build:
      context: .
      args:
        MODULE: alerting-service
    image: telemetry/alerting-service:dev
    profiles: ["pipeline"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      seed-sensors:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_URL: jdbc:postgresql://timescaledb:5432/telemetry
      DB_USER: telemetry_app
      DB_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      DLQ_FALLBACK_PATH: /data/dlq-fallback.jsonl
    volumes:
      - alerting-data:/data

  # Dev-only: writes the JWT public key (from JWT_PUBLIC_KEY_BASE64) into a volume for api-service.
  jwt-key-init:
    image: eclipse-temurin:26-jre
    profiles: ["pipeline"]
    environment:
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -n "$$JWT_PUBLIC_KEY_BASE64" || { echo "JWT_PUBLIC_KEY_BASE64 is not set"; exit 1; } ;
        printf -- "-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n" "$$JWT_PUBLIC_KEY_BASE64" > /keys/public.pem
        && chmod 644 /keys/public.pem
    volumes:
      - jwt-keys:/keys

  api:
    build:
      context: .
      args:
        MODULE: api-service
    image: telemetry/api-service:dev
    profiles: ["pipeline"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      jwt-key-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/telemetry
      SPRING_DATASOURCE_USERNAME: telemetry_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      APP_SECURITY_JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - jwt-keys:/keys:ro
volumes:
  kafka-data:
  timescale-data:
  jwt-keys:
  alerting-data:
